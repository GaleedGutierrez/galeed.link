---
name: 💅 Lint
on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

# Super Linter's job grants itself statuses: write below.
permissions:
  contents: read

jobs:
  lint:
    name: 🎀 ESLint - StyleLint - Prettier - HTMLHint - MarkdownLint - JCPD
    runs-on: ubuntu-latest
    steps:
      - name: 👍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🌹 ESLint
        run: npm run lint

      - name: 👔 StyleLint
        run: npm run stylelint

      - name: 📄 Markdown
        run: npm run lint-md

      - name: 📐 Prettier
        run: npm run prettier

      - name: 👯‍♂️ JavaScript Copy/Paste Detector
        run: npm run check-for-dupes

  build:
    name: 💐 Super Linter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: 👍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 💐 Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_EDITORCONFIG: false
          VALIDATE_CSS: false
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_HTML: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_TSX: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_JSON: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_JSONC: false
          VALIDATE_JSONC_PRETTIER: false
          VALIDATE_JSCPD: false
          VALIDATE_MARKDOWN_PRETTIER: false
          # ESLint and Prettier already lint and format the code (job above).
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
