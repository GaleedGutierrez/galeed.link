---
name: 💅 Lint
on: # yamllint disable-line rule:truthy
  # Branch pushes run once, through their pull request.
  push:
    branches: [main]
  pull_request: null

# Super Linter's job grants itself statuses: write below.
permissions:
  contents: read

# A new push to a pull request cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Required by the main ruleset: keep the name.
    name: 🎀 ESLint - StyleLint - Prettier - HTMLHint - MarkdownLint - JCPD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 👍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔷 Type check
        run: npm run typecheck

      - name: 🌹 ESLint
        run: npm run lint

      - name: 👔 StyleLint
        run: npm run stylelint

      - name: 📄 Markdown
        run: npm run lint-md

      - name: 📐 Prettier
        run: npm run prettier

      - name: 👯‍♂️ JavaScript Copy/Paste Detector
        run: npm run check-for-dupes

  build:
    # Required by the main ruleset: keep the name.
    name: 💐 Super Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: 👍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      # The Prettier plugins and the commitlint config load from node_modules.
      - name: 🐢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 💐 Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_EDITORCONFIG: false
          VALIDATE_CSS: false
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_HTML: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_TSX: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_JSON: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_JSONC: false
          VALIDATE_JSONC_PRETTIER: false
          VALIDATE_JSCPD: false
          VALIDATE_MARKDOWN_PRETTIER: false
          # ESLint and Prettier already lint and format the code (job above).
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # textlint runs in the job above (npm run lint-md) with the
          # project's .textlintrc.json; Super Linter's copy reads only its own
          # bundled config and rules.
          VALIDATE_NATURAL_LANGUAGE: false
          # markdownlint runs in the job above (npm run lint-md) with
          # .markdownlint-cli2.jsonc; Super Linter's copy reads its bundled
          # template, a looser config.
          VALIDATE_MARKDOWN: false
          # Agent skills are third-party files, installed as-is.
          FILTER_REGEX_EXCLUDE: (^|/)\.(agents|claude)/
