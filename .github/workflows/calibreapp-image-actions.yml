---
name: 🖼️ Compress Images
on:
  # Only the images served as-is: og.jpg and the icons in public/. Astro
  # re-encodes every image it imports (src/) at build time, so compressing
  # those sources gains nothing.
  pull_request:
    paths:
      - "public/**.jpg"
      - "public/**.jpeg"
      - "public/**.png"

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    # The action commits the compressed images and comments on the PR:
    # nothing else needs write access.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 👍 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🗜️ Compress Images
        # Pinned to a commit SHA: a branch ref would run whatever the upstream
        # main holds, with this job's write token.
        uses: calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43 # 1.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A pull request touching public/ may also change images elsewhere,
          # and the action compresses every changed image it doesn't ignore
          # (minimatch globs). Only og.jpg and the icons are left: the WebP
          # portrait in public/ is skipped too.
          ignorePaths: "node_modules/**,src/**,tests/**,scripts/**,dist/**,public/**/*.webp"
