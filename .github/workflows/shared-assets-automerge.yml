---
name: "🤖 Auto-merge shared-assets"
on: # yamllint disable-line rule:truthy
  - pull_request

permissions: {}

jobs:
  automerge:
    # Patch bumps of our own data package are content updates (new projects,
    # typo fixes). Minor bumps (0.x.0) can break the API, so they stay manual.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.dependency-names == '@galeedgutierrez/shared-assets' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
