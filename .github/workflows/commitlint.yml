---
name: 📝 Commitlint
on:
  # Branch pushes are linted locally by the pre-push hook, and in CI by their
  # pull request: main only needs its merge commits checked.
  push:
    branches: [main]
  pull_request:
    # edited: the title is linted too, and the type label comes from it.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# A new push or title edit cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🐢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile's commitlint and config, the same ones the commit-msg
      # hook runs (not a bundled copy, as the Docker-based actions ship).
      - name: 📥 Install Dependencies
        run: npm ci

      - name: ✅🗃️ Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      # base..head: the commits on the branch, even after merging main into
      # it (head~N counted main's commits as the branch's).
      - name: ✅👥 Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: ✅🏷️ Validate PR title with commitlint
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
