---
name: 🗼 Lighthouse
on: # yamllint disable-line rule:truthy
  # Branch pushes run once, through their pull request.
  push:
    branches: [main]
  pull_request: null

permissions: {}

# A new push to a pull request cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required by the main ruleset: keep the job id.
  lighthouseci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 👍 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git-history reads the last content commit for the page's date.
          fetch-depth: 0

      - name: 🐢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🏗️ Build App
        run: npm run build

      # Serves dist/ and asserts the scores in lighthouserc.json.
      - name: 📊 Run Lighthouse
        run: npx lhci autorun

      - name: 📝 Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
