---
# Area labels from the files a pull request changes (actions/labeler, globs are
# minimatch). The type label comes from the title: see workflows/labeler.yml.
# Colors and descriptions live in labels.yml.

"area: components":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"
          - "src/layouts/**"
          - "src/pages/*.astro"
          - "src/types/designTokens.ts"

"area: styles":
  - changed-files:
      - any-glob-to-any-file:
          - "src/styles/**"
          - "src/**/*.css"
          - "src/scripts/theme.ts"
          - "uno.config.ts"
          - "postcss.config.js"
          - "public/fonts/**"

"area: content":
  - changed-files:
      - any-glob-to-any-file:
          - "src/data/hub.ts"
          - "src/assets/**"
          - "public/profile.webp"

"area: seo":
  - changed-files:
      - any-glob-to-any-file:
          - "src/data/*Schema.ts"
          - "src/layouts/Layout/index.astro"
          - "src/pages/llms.txt.ts"
          - "src/utils/lastModified.ts"
          - "scripts/gitHistory.ts"
          - "public/og.jpg"
          - "public/robots.txt"
          - "public/site.webmanifest"
          - "public/favicon.*"
          - "public/*.png"
          - "src/utils/markdown.ts"

"area: security":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/csp*.ts"
          - "public/_headers"
          - "src/utils/safeUrl.ts"
          - "SECURITY.md"
          - ".github/workflows/codeql.yml"
          - ".github/linters/trivy.yaml"

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - "astro.config.mjs"
          - "package.json"
          - "package-lock.json"
          - "tsconfig.json"
          - ".nvmrc"
          - "src/*.d.ts"
          - "src/types/*.d.ts"

"area: ci":
  - changed-files:
      # One file must match both: the templates are Markdown, so they are docs.
      - all-globs-to-any-file:
          - ".github/**"
          - "!.github/**/*.md"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/*.test.ts"
          - "vitest.config.ts"
          - "playwright.config.ts"

"area: tooling":
  - changed-files:
      - any-glob-to-any-file:
          - ".husky/**"
          - ".vscode/**"
          - ".github/linters/**"
          - "eslint.config.js"
          - "commitlint.config.ts"
          - ".prettierrc.json"
          - ".stylelintrc.json"
          - ".markdownlint-cli2.jsonc"
          - ".textlintrc.json"
          - ".*ignore"
          - ".editorconfig"
          - ".gitattributes"

"area: docs":
  - changed-files:
      # Root-level Markdown only: the skills under .agents/ and .claude/ are
      # Markdown too, and belong to area: agents.
      - any-glob-to-any-file:
          - "*.md"
          - ".github/**/*.md"
          - "LICENSE"

"area: agents":
  - changed-files:
      - any-glob-to-any-file:
          - ".agents/**"
          - ".claude/**"
          - "CLAUDE.md"
          - "skills-lock.json"
