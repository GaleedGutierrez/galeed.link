---
# Every label the labelers apply, synced to GitHub by workflows/label-sync.yml.
# Labels missing from this file are kept (skip-delete). `from_name` renames an
# existing label, so the issues and pull requests that carry it keep it.

# Type: one per pull request, from the Conventional Commit type of its title
# (or its branch prefix). Set by workflows/labeler.yml.
- name: "type: feat"
  color: "0e8a16"
  description: "A new feature"
- name: "type: fix"
  from_name: "fix"
  color: "d73a4a"
  description: "A bug fix"
- name: "type: perf"
  color: "fbca04"
  description: "A performance improvement"
- name: "type: refactor"
  color: "5319e7"
  description: "A code change that neither fixes a bug nor adds a feature"
- name: "type: style"
  from_name: "style"
  color: "d4c5f9"
  description: "A visual or formatting change, no behavior change"
- name: "type: test"
  from_name: "test"
  color: "bfd4f2"
  description: "Adds or corrects tests"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: build"
  from_name: "build"
  color: "1d76db"
  description: "The build pipeline or dependencies"
- name: "type: ci"
  from_name: "continuous integration"
  color: "006b75"
  description: "GitHub Actions and repository automation"
- name: "type: chore"
  from_name: "chore"
  color: "c2c5cc"
  description: "Maintenance that touches no source or test"
- name: "type: revert"
  color: "b60205"
  description: "Reverts an earlier change"
- name: "breaking change"
  color: "e11d21"
  description: "Title with `!` or a BREAKING CHANGE footer"

# Area: the parts of the project a pull request touches, from its changed files
# (labeler.yml), or the area picked in an issue form (issue-label.yml).
- name: "area: components"
  color: "f0b88a"
  description: "src/components, src/layouts and the pages"
- name: "area: styles"
  color: "f0b88a"
  description: "Global ITCSS, CSS Modules, UnoCSS and the theme"
- name: "area: content"
  color: "f0b88a"
  description: "Copy and data shown on the page (src/data/hub.ts, images)"
- name: "area: seo"
  color: "f0b88a"
  description: "Meta tags, JSON-LD, llms.txt, og.jpg, icons and robots.txt"
- name: "area: security"
  color: "f0b88a"
  description: "Content-Security-Policy, headers and URL safety"
- name: "area: build"
  color: "f0b88a"
  description: "scripts/, astro.config.mjs and package.json"
- name: "area: ci"
  color: "f0b88a"
  description: "Workflows and GitHub configuration"
- name: "area: tests"
  color: "f0b88a"
  description: "Vitest suites and their configuration"
- name: "area: tooling"
  color: "f0b88a"
  description: "Linters, formatters, Git hooks and the editor setup"
- name: "area: docs"
  from_name: "documentation"
  color: "f0b88a"
  description: "README, DESIGN_SYSTEM.md, CLAUDE.md and the templates"
- name: "area: agents"
  color: "f0b88a"
  description: "Agent skills and instructions (.agents, .claude, CLAUDE.md)"

# Concern: cross-cutting qualities, picked in an issue form or added by hand.
- name: "a11y"
  color: "7057ff"
  description: "Accessibility (WCAG 2.2 AAA)"
- name: "performance"
  color: "fbca04"
  description: "Load speed, Core Web Vitals or Lighthouse scores"

# Issue: set by the issue forms, or by hand during triage.
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

# Set by Dependabot (dependabot.yml).
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
