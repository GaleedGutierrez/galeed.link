---
name: 🐛 Bug report
description: Something on galeed.link looks or works wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Found a security flaw? Don't file it here, where anyone can read it:
        [report it privately](https://github.com/GaleedGutierrez/galeed.link/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Skip it for a typo or wrong data.
      placeholder: |
        1. Open https://galeed.link/ on a phone
        2. Switch to the dark theme
        3. Scroll to the footer
  # issue-label.yml maps each option to an area or concern label: keep the
  # option names and those patterns in step (tests/issueForms.test.ts).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick every part it touches, or "Not sure".
      multiple: true
      options:
        - Content
        - Components
        - Styles and theme
        - SEO and link previews
        - Accessibility
        - Performance
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Page
      multiple: true
      options:
        - Home (/)
        - 404 page
        - /llms.txt
        - Link preview when shared
        - Not sure
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
        - Not sure
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 145 on Windows 11, Safari on iPhone 16…
  - type: input
    id: accessibility-settings
    attributes:
      label: Accessibility settings
      description: Any system setting that changes how the site looks or reads.
      placeholder: Reduced motion, Windows contrast theme, 200% zoom, NVDA…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here.
