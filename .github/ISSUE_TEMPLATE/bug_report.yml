---
name: 🐛 Bug report
description: Something on galeed.link looks or works wrong.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://galeed.link/ on a phone
        2. Switch to the dark theme
        3. Scroll to the footer
    validations:
      required: true
  # issue-label.yml maps each option to an area or concern label: keep the
  # option names and those patterns in step.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick every part it touches, or "Not sure".
      multiple: true
      options:
        - Content
        - Components
        - Styles and theme
        - SEO and link previews
        - Accessibility
        - Performance
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
        - Not sure
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 145 on Windows 11, Safari on iPhone 16…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here.
