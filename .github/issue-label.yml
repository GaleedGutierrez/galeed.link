---
# Area and concern labels from the "Area" dropdown of the issue forms
# (github/issue-labeler). A form renders the answer under its heading, the
# picks joined by ", ":
#
#   ### Area
#
#   Content, Styles and theme
#
# Each pattern finds its option on the line after that heading, so prose that
# mentions "content" elsewhere adds nothing. The type label (bug, enhancement,
# question) comes from the form itself. Keep the option names in step with
# ISSUE_TEMPLATE/*.yml.

"area: content":
  - '/### Area\s+[^\n]*\bContent\b/'

"area: components":
  - '/### Area\s+[^\n]*\bComponents\b/'

"area: styles":
  - '/### Area\s+[^\n]*\bStyles and theme\b/'

"area: seo":
  - '/### Area\s+[^\n]*\bSEO and link previews\b/'

"a11y":
  - '/### Area\s+[^\n]*\bAccessibility\b/'

"performance":
  - '/### Area\s+[^\n]*\bPerformance\b/'
