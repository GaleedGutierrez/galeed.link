---
# Basic set up for two package managers

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`.
    # (You don't need to specify `/.github/workflows` for `directory`.
    # You can use `directory: "/"`.)
    labels:
      - dependencies
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release: most malicious versions are caught and
    # pulled within days.
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    commit-message:
      prefix: "chore: :arrow_up:"
    # One pull request a week for every action bump.
    groups:
      actions:
        patterns: ["*"]
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    # Replaces the default pair (dependencies, javascript).
    labels:
      - dependencies
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release: most malicious versions are caught and
    # pulled within days.
    cooldown:
      default-days: 7
      # Our own package: content updates should land without the wait.
      exclude:
        - "@galeedgutierrez/shared-assets"
    # Minor and patch bumps of the tooling share one pull request. Runtime
    # dependencies (shared-assets among them, which auto-merges on its own)
    # and major bumps keep one each.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
